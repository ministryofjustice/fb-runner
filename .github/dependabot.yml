# Follows the MoJ Developer Portal "Dependabot guidelines":
#   - minor and patch upgrades are each grouped into a single PR per ecosystem
#   - major upgrades are NOT grouped; they continue to get their own individual PRs
#   - minor and patch security fixes are grouped into a single PR per ecosystem
#     (security fixes ignore cooldown, so they still arrive straight away
#     https://github.com/dependabot/dependabot-core/discussions/15582)
#
# Not covered by Dependabot (CircleCI): orbs and images in .circleci/config.yml.
# See the team note on how those are kept up to date.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # Ruby gems (Gemfile / Gemfile.lock)
  # ---------------------------------------------------------------------------
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
      # Our own MoJ gems: we know when they are released, so no need to wait
      exclude:
        - "metadata_presenter"
        - "fb-jwt-auth"
    # Shakapacker must be the exact same version in the Gemfile and package.json.
    # Upgrade both together manually https://shakapacker.com/docs/common-upgrades/.
    ignore:
      - dependency-name: "shakapacker"
    labels:
      - "dependencies"
      - "ruby"
    groups:
      # All minor upgrades in one PR
      minor-updates:
        update-types:
          - "minor"
      # All patch upgrades in one PR
      patch-updates:
        update-types:
          - "patch"
      # All minor and patch security fixes in one PR
      security-updates:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # JavaScript packages (package.json / yarn.lock)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Shakapacker must be the exact same version in the Gemfile and package.json.
    # Upgrade both together manually https://shakapacker.com/docs/common-upgrades/.
    ignore:
      - dependency-name: "shakapacker"
      - dependency-name: "shakapacker-rspack"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # All minor upgrades in one PR
      minor-updates:
        update-types:
          - "minor"
      # All patch upgrades in one PR
      patch-updates:
        update-types:
          - "patch"
      # All minor and patch security fixes in one PR
      security-updates:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
